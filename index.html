<!-- Sanket EA Tasks - GitHub page (mic). Isse badalne ki zarurat nahi; setup page par hota hai. -->
<!DOCTYPE html><html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E8731C">
<title>Sanket – EA Tasks</title>
<script>
/* GitHub page -> Apps Script bridge. Script link aur passcode is device me yaad rahte hain (page code me nahi). */
(function(){
  var LS = {
    get: function(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return window['_ls_'+k] || ''; } },
    set: function(k,v){ try { localStorage.setItem(k, v); } catch(e){ window['_ls_'+k] = v; } }
  };
  try {
    var h = location.hash.slice(1);
    if (h){
      var p = new URLSearchParams(h);
      if (p.get('u')) LS.set('apiUrl', p.get('u'));
      if (p.get('k')) LS.set('apiKey', p.get('k'));
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch(e){}
  window.MIC_MODE = 'live';
  window.MIC_LANG = LS.get('micLang') || 'mr-IN';
  window.SAVE_VOICE = true;
  var queue = [], setupShown = false;
  function ready(){ return LS.get('apiUrl') && LS.get('apiKey'); }
  function handle(j, ok, fail){
    if (j && j.ok){
      if (j.data && j.data.micLang){ window.MIC_LANG = j.data.micLang; window.SAVE_VOICE = j.data.saveVoice !== false; }
      if (ok) ok(j.data);
    } else {
      if (j && j.code === 'KEY'){ LS.set('apiKey', ''); showSetup('Passcode galat hai. Dobara daliye.'); }
      if (fail) fail(new Error((j && j.error) || 'Unknown error'));
    }
  }
  var cbn = 0;
  // JSONP: <script> tag se GET - isme CORS / "Failed to fetch" ki dikkat nahi aati
  function jsonp(fn, extra, ok, fail){
    var cb = '__ea' + Date.now().toString(36) + (cbn++), done = false, sc = document.createElement('script');
    function clean(){ done = true; try { delete window[cb]; } catch(e){ window[cb] = undefined; } if (sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cb] = function(j){ if (done) return; clean(); handle(j, ok, fail); };
    sc.onerror = function(){ if (done) return; clean(); if (fail) fail(new Error('Sheet se jud nahi paya. Script link check kijiye, aur Deploy me "Who has access: Anyone" + New version kijiye.')); };
    setTimeout(function(){ if (done) return; clean(); if (fail) fail(new Error('Sheet ne 90 second me jawab nahi diya. Internet check karke dobara try kijiye.')); }, 90000);
    sc.src = LS.get('apiUrl') + '?fn=' + encodeURIComponent(fn) + '&k=' + encodeURIComponent(LS.get('apiKey')) + '&cb=' + cb + extra + '&_=' + Date.now();
    (document.head || document.documentElement).appendChild(sc);
  }
  // Badi cheez (aawaz / lamba text) POST se bhejo; jawab nahi padhna (no-cors), sirf pahunchna zaruri hai
  function stash(body){
    return fetch(LS.get('apiUrl'), { method:'POST', mode:'no-cors', body: JSON.stringify(body) });
  }
  function rid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function send(fn, args, ok, fail){
    var key = LS.get('apiKey');
    if (fn === 'addTask' && args[4]){
      var vid = rid();
      stash({ key:key, kind:'voice', id:vid, b64:args[4], mime:args[5], task:args[1] })
        .then(function(){ send('addTask', [args[0], args[1], args[2], args[3], '', '', vid], ok, fail); })
        .catch(function(){
          alert('Aawaz upload nahi hui (internet?). Kaam bina aawaz ke add ho raha hai.');
          send('addTask', [args[0], args[1], args[2], args[3], '', ''], ok, fail);
        });
      return;
    }
    var enc = encodeURIComponent(JSON.stringify(args));
    if (enc.length > 1500){
      var id = rid();
      stash({ key:key, kind:'args', id:id, args:args })
        .then(function(){ jsonp(fn, '&s=' + id, ok, fail); })
        .catch(function(e){ if (fail) fail(new Error('Internet ya link ki problem: ' + (e && e.message ? e.message : e))); });
      return;
    }
    jsonp(fn, '&a=' + enc, ok, fail);
  }
  function flush(){ var q = queue; queue = []; q.forEach(function(c){ send(c[0], c[1], c[2], c[3]); }); }
  function runner(){
    var ok = null, fail = null, o;
    o = new Proxy({}, { get: function(t, k){
      if (k === 'withSuccessHandler') return function(f){ ok = f; return o; };
      if (k === 'withFailureHandler') return function(f){ fail = f; return o; };
      return function(){
        var a = Array.prototype.slice.call(arguments);
        if (ready()) send(k, a, ok, fail);
        else { queue.push([k, a, ok, fail]); showSetup(''); }
      };
    }});
    return o;
  }
  window.google = { script: {} };
  Object.defineProperty(window.google.script, 'run', { get: runner });

  function showSetup(msg){
    if (setupShown) return;
    if (!document.body){ document.addEventListener('DOMContentLoaded', function(){ showSetup(msg); }); return; }
    setupShown = true;
    var o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px';
    o.innerHTML = '<div style="background:#fff;border-radius:12px;padding:18px;max-width:420px;width:100%;font-family:Arial">' +
      '<div style="font-weight:bold;color:#E8731C;font-size:18px;margin-bottom:6px">Ek baar setup</div>' +
      '<div style="font-size:13px;color:#555;margin-bottom:10px">Sheet me menu <b>Sanket Tasks → Show dashboard link</b> se "Script link" aur "Passcode" milenge.</div>' +
      (msg ? '<div style="color:#C62828;font-weight:bold;margin-bottom:8px">' + msg + '</div>' : '') +
      '<label style="font-size:13px">Script link</label><input id="suUrl" style="width:100%;box-sizing:border-box;padding:10px;font-size:15px;margin:4px 0 10px;border:1px solid #ccc;border-radius:8px" placeholder="https://script.google.com/macros/s/.../exec">' +
      '<label style="font-size:13px">Passcode</label><input id="suKey" inputmode="numeric" style="width:100%;box-sizing:border-box;padding:10px;font-size:15px;margin:4px 0 10px;border:1px solid #ccc;border-radius:8px">' +
      '<label style="font-size:13px">Bolne ki bhasha</label><select id="suLang" style="width:100%;padding:10px;font-size:15px;margin:4px 0 14px;border:1px solid #ccc;border-radius:8px"><option value="mr-IN">Marathi</option><option value="hi-IN">Hindi</option></select>' +
      '<button id="suOk" style="width:100%;background:#E8731C;color:#fff;border:0;border-radius:8px;padding:12px;font-size:16px;font-weight:bold">Save</button></div>';
    document.body.appendChild(o);
    document.getElementById('suUrl').value = LS.get('apiUrl');
    document.getElementById('suKey').value = LS.get('apiKey');
    document.getElementById('suLang').value = window.MIC_LANG;
    document.getElementById('suOk').onclick = function(){
      var u = document.getElementById('suUrl').value.trim(), k = document.getElementById('suKey').value.trim();
      if (u.indexOf('https://script.google.com/') !== 0 || !k){ alert('Script link (https://script.google.com/...) aur Passcode dono daliye.'); return; }
      LS.set('apiUrl', u); LS.set('apiKey', k); LS.set('micLang', document.getElementById('suLang').value);
      window.MIC_LANG = document.getElementById('suLang').value;
      document.body.removeChild(o); setupShown = false;
      if (queue.length) flush(); else google.script.run.withSuccessHandler(function(d){ if (window.render) render(d); }).getData();
    };
  }
  window.showSetup = showSetup;
  document.addEventListener('DOMContentLoaded', function(){
    var a = document.createElement('a'); a.href = '#'; a.textContent = '⚙ Setup';
    a.style.cssText = 'position:fixed;right:10px;bottom:10px;font-size:12px;color:#999;background:#fff;padding:4px 8px;border-radius:8px;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.15)';
    a.onclick = function(e){ e.preventDefault(); showSetup(''); };
    document.body.appendChild(a);
  });
})();
</script>

<style>
#micBtn{background:#1565C0;font-size:20px;padding:4px}
#micBtn.rec{background:#C62828;animation:micp 1s infinite}
@keyframes micp{50%{opacity:.55}}
#micSt{font-size:13px;margin-top:6px;min-height:16px}
.vbtn{background:#1565C0!important;font-size:12px!important;padding:5px 10px!important;margin-top:6px}
.vaud{width:100%;max-width:340px;margin-top:6px;display:block}
.task.hot{border-color:#D50000!important;background:#FFEBEE!important;animation:hotf 1.1s ease-in-out infinite}
@keyframes hotf{0%,100%{box-shadow:0 0 0 0 rgba(213,0,0,.0)}50%{box-shadow:0 0 14px 4px rgba(213,0,0,.75);background:#FFCDD2}}
.hotb{display:inline-block;background:#D50000;color:#fff;font-weight:bold;font-size:12px;padding:2px 8px;border-radius:9px;margin-right:6px;animation:hotb 1s steps(2,start) infinite}
@keyframes hotb{to{visibility:hidden}}

<script>
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var mic = document.getElementById('micBtn'), box = document.getElementById('task'), st = document.getElementById('micSt');
  var on = false, rec = null, mr = null, stream = null, chunks = [], base = '', fin = '';
  window._voice = null;
  function say(m, c){ st.textContent = m || ''; st.style.color = c || '#555'; }
  function pick(){
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    var l = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
    for (var i=0;i<l.length;i++) if (MediaRecorder.isTypeSupported(l[i])) return l[i];
    return '';
  }
  function startText(){
    if (!SR){ say('Is browser me bolkar likhna nahi chalta. Chrome me kholiye.', '#C62828'); return; }
    rec = new SR(); rec.lang = window.MIC_LANG || 'mr-IN'; rec.interimResults = true; rec.continuous = true;
    base = box.value.trim(); fin = '';
    rec.onresult = function(ev){
      var interim = '';
      for (var i=ev.resultIndex;i<ev.results.length;i++){
        var t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) fin += t + ' '; else interim += t;
      }
      box.value = ((base ? base + ' ' : '') + fin + interim).trim();
    };
    rec.onerror = function(e){
      if (e.error === 'audio-capture' && mr && mr.state === 'recording'){ mr.stop(); say('Is device par aawaz-record aur text ek saath nahi chalte. Text chalu hai; jitni aawaz record hui wo save hogi.', '#8D6E00'); return; }
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture'){ goRecorder(); on = false; stopAll(); say('Is device par page ke andar mic band hai. Ab 🎤 dobara dabaiye, tab ka recorder khulega.', '#C62828'); return; }
      if (e.error !== 'no-speech' && e.error !== 'aborted') say('Mic error: ' + e.error, '#C62828');
    };
    rec.onend = function(){
      if (on){ base = box.value.trim(); fin = ''; try { rec.start(); } catch(e){} }
    };
    try { rec.start(); } catch(e){ say('Mic start nahi hua: ' + e.message, '#C62828'); }
  }
  function startRec(){
    if (!window.SAVE_VOICE || !navigator.mediaDevices || !window.MediaRecorder) return Promise.resolve();
    return navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream = s; chunks = []; var m = pick();
      mr = m ? new MediaRecorder(s, {mimeType:m}) : new MediaRecorder(s);
      mr.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        var b = new Blob(chunks, {type: mr.mimeType || m || 'audio/webm'});
        if (b.size < 1500){ say('Aawaz record nahi hui, sirf text jayega.', '#8D6E00'); return; }
        var fr = new FileReader();
        fr.onload = function(){ window._voice = {b64:String(fr.result).split(',')[1], mime:b.type}; say('✔ Aawaz tayyar. Text check karke Add dabaiye.', '#2E7D32'); };
        fr.readAsDataURL(b);
      };
      mr.start();
    }).catch(function(e){
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')){ goRecorder(); on = false; stopAll(); say('Is device par page ke andar mic band hai. Ab 🎤 dobara dabaiye, tab ka recorder khulega.', '#C62828'); return; }
      say('Recording nahi hui (sirf text banega): ' + (e.name || e), '#8D6E00');
    });
  }
  function stopAll(){
    on = false; mic.classList.remove('rec'); mic.innerHTML = '&#127908;';
    if (rec) try { rec.stop(); } catch(e){}
    setTimeout(function(){ if (mr && mr.state !== 'inactive') mr.stop(); else if (!window._voice) say('Text check karke Add dabaiye.', '#2E7D32'); }, 600);
  }
  var mf = document.getElementById('micFile'), prev = document.getElementById('micPrev');
  function mode(){ var m = window.MIC_MODE || 'recorder'; try { if (localStorage.getItem('micMode')) m = localStorage.getItem('micMode'); } catch(e){} return m; }
  function goRecorder(){ try { localStorage.setItem('micMode', 'recorder'); } catch(e){} }
  function clearVoice(){ window._voice = null; prev.innerHTML = ''; mf.value = ''; }
  mf.onchange = function(){
    var f = mf.files && mf.files[0]; if (!f) return;
    if (f.size > 25*1024*1024){ say('Recording bahut badi hai (25 MB se zyada). Chhoti recording kijiye.', '#C62828'); mf.value=''; return; }
    say('Aawaz load ho rahi hai...', '#1565C0');
    var fr = new FileReader();
    fr.onload = function(){
      var url = String(fr.result);
      window._voice = { b64: url.split(',')[1], mime: f.type || 'audio/mp4' };
      prev.innerHTML = '<audio controls class=vaud src="' + url + '"></audio><a href="#" id="micDel" style="font-size:12px;color:#C62828">✖ Ye aawaz hatao</a>';
      document.getElementById('micDel').onclick = function(e){ e.preventDefault(); clearVoice(); say(''); };
      say('✔ Aawaz tayyar (▶ se sun sakte hain). Ab Task ke khane me keyboard ke mic se likhiye, phir Add dabaiye.', '#2E7D32');
      setTimeout(function(){ try { box.focus(); } catch(e){} }, 300);
    };
    fr.onerror = function(){ say('Aawaz load nahi hui.', '#C62828'); };
    fr.readAsDataURL(f);
  };
  mic.onclick = function(){
    if (on){ stopAll(); return; }
    if (mode() === 'recorder'){ clearVoice(); say('Recorder khul raha hai... bolkar Save / ✔ dabaiye.', '#1565C0'); mf.click(); return; }
    window._voice = null; on = true;
    mic.classList.add('rec'); mic.innerHTML = '&#9209;';
    say('Boliye... khatam ho to ⏹ dabaiye', '#C62828');
    startRec().then(function(){ if (on && mode() !== 'recorder') startText(); });
  };
  document.getElementById('addBtn').onclick = function(){
    if (on){ alert('Pehle ⏹ (stop) dabaiye.'); return; }
    var t = box.value.trim(); if (!t){ err('Please write the task.'); return; }
    var dv = document.getElementById('due').value;
    if (dv && dv < todayYmd()){ err('Due date cannot be before today. Please choose today or a later date.'); alert('Due date cannot be before today.'); return; }
    if (busy) return;
    var v = window._voice;
    if (v) say('Aawaz Drive me save ho rahi hai...', '#1565C0');
    call('addTask', [document.getElementById('by').value, t, dv, document.getElementById('prio').value, v ? v.b64 : '', v ? v.mime : '']);
    clearVoice(); box.value = ''; document.getElementById('due').value = '';
    setTimeout(function(){ if (!busy) say(''); }, 4000);
  };
  function addPlay(h, x){
    if (!x.voice || x.voice.indexOf('http') !== 0) return h;
    var i = h.indexOf('<div class=name>'); if (i < 0) return h;
    var j = h.indexOf('</div>', i); if (j < 0) return h;
    j += 6;
    return h.slice(0, j) + '<button class=vbtn data-a=play data-v="' + esc(x.voice) + '">▶ Aawaz suniye</button>' + h.slice(j);
  }
  var _ih = itemHtml, _sh = somedayHtml;
  function addHot(h, x){
    if (x.done || x.prio !== 'High' || (x.status !== 'overdue' && x.status !== 'today')) return h;
    h = h.replace('<div class="task ', '<div class="task hot ');
    return h.replace('<div class=meta>', '<div class=meta><span class=hotb>🔥 ' + (x.status === 'overdue' ? 'URGENT – late' : 'URGENT – aaj') + '</span>');
  }
  itemHtml = function(x){ return addHot(addPlay(_ih(x), x), x); };
  somedayHtml = function(x){ return addPlay(_sh(x), x); };
  document.getElementById('list').addEventListener('click', function(e){
    var b = e.target.closest('button.vbtn'); if (!b) return;
    e.stopPropagation(); e.stopImmediatePropagation(); e.preventDefault();
    var nx = b.nextElementSibling;
    if (nx && nx.tagName === 'AUDIO'){ nx.play(); return; }
    b.disabled = true; b.textContent = 'Load ho raha hai...';
    google.script.run.withSuccessHandler(function(d){
      var a = document.createElement('audio'); a.controls = true; a.className = 'vaud';
      a.src = 'data:' + d.mime + ';base64,' + d.data;
      var lk = document.createElement('a'); lk.href = b.getAttribute('data-v'); lk.target = '_blank'; lk.textContent = 'Drive me kholein'; lk.style.cssText = 'font-size:12px;display:none';
      a.onerror = function(){ lk.style.display = 'inline'; };
      b.parentNode.insertBefore(lk, b.nextSibling);
      b.parentNode.insertBefore(a, b.nextSibling);
      b.disabled = false; b.textContent = '▶ Aawaz suniye';
      try { a.play(); } catch(e){}
    }).withFailureHandler(function(er){ b.disabled = false; b.textContent = '▶ Aawaz suniye'; alert('Aawaz nahi chali: ' + (er && er.message ? er.message : er)); }).getVoice(b.getAttribute('data-v'));
  }, true);
  if (window._d) applyView();
})();
</script>
